proxy-groups:
  # ---------- 服务组 ----------
  - name: "📹 YouTube"
    type: select
    proxies:
      - DIRECT
      - "🚀 节点选择"
      - "♻️ 自动选择"
      - "⚖️ 新加坡均衡"
      - "⚖️ 美国均衡"
    include-all-proxies: true

  - name: "🧠 GPT-Claude"
    type: select
    proxies:
      - "🇺🇲 美国节点"
      - "⚖️ 美国均衡"
      - "🇸🇬 新加坡节点"
      - "⚖️ 新加坡均衡"
      - "🚀 节点选择"
      - DIRECT
    include-all-proxies: true

  - name: "✨ Gemini"
    type: select
    proxies:
      - "🇺🇲 美国节点"
      - "⚖️ 美国均衡"
      - "🇸🇬 新加坡节点"
      - "⚖️ 新加坡均衡"
      - "🚀 节点选择"
      - DIRECT
    include-all-proxies: true

  - name: "🎮 游戏平台"
    type: select
    proxies:
      - DIRECT
      - "🚀 节点选择"
      - "♻️ 自动选择"
      - "⚖️ 新加坡均衡"
      - "⚖️ 美国均衡"
    include-all-proxies: true

  - name: "🚀 节点选择"
    type: select
    proxies:
      - "♻️ 自动选择"
      - "🇸🇬 新加坡节点"
      - "🇺🇲 美国节点"
      - "⚖️ 新加坡均衡"
      - "⚖️ 美国均衡"
    include-all-proxies: true

  # ---------- 自动测速 / 均衡 ----------
  - name: "♻️ 自动选择"
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    include-all-proxies: true
    exclude-filter: "到期|流量|套餐|官网|剩余|过滤|状态|账户欠费|2\\.0|2倍|2x|3\\.0|3倍|3x|4\\.0|4倍|4x"

  - name: "⚖️ 新加坡均衡"
    type: load-balance
    strategy: consistent-hashing
    url: https://www.gstatic.com/generate_204
    interval: 300
    include-all-proxies: true
    filter: "新加坡|坡|狮城|SG|Singapore"
    exclude-filter: "游戏|剩余|流量|2\\.0|2倍|2x|3\\.0|3倍|3x|4\\.0|4倍|4x"

  - name: "⚖️ 美国均衡"
    type: load-balance
    strategy: consistent-hashing
    url: https://www.gstatic.com/generate_204
    interval: 300
    include-all-proxies: true
    filter: "美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States"
    exclude-filter: "游戏|剩余|流量|2\\.0|2倍|2x|3\\.0|3倍|3x|4\\.0|4倍|4x"

  # ---------- 地区分组 ----------
  - name: "🇸🇬 新加坡节点"
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    include-all-proxies: true
    filter: "新加坡|坡|狮城|SG|Singapore"
    exclude-filter: "游戏|剩余|流量|2\\.0|2倍|2x|3\\.0|3倍|3x|4\\.0|4倍|4x"

  - name: "🇺🇲 美国节点"
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    include-all-proxies: true
    filter: "美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States"
    exclude-filter: "游戏|剩余|流量|2\\.0|2倍|2x|3\\.0|3倍|3x|4\\.0|4倍|4x"

