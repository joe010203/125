rules:
  # 广告拦截
  - RULE-SET,banad,REJECT
  - RULE-SET,banprogramad,REJECT
  # Steam 国内下载直连(必须在 Steam 代理规则之前)
  - RULE-SET,steamcn,DIRECT
  # 分流服务
  - RULE-SET,youtube,📹 YouTube
  - RULE-SET,openai,🧠 GPT-Claude
  - RULE-SET,claude,🧠 GPT-Claude
  - RULE-SET,gemini,✨ Gemini
  - RULE-SET,epic,🎮 游戏平台
  - RULE-SET,origin,🎮 游戏平台
  - RULE-SET,sony,🎮 游戏平台
  - RULE-SET,steam,🎮 游戏平台
  - RULE-SET,nintendo,🎮 游戏平台
  # Google 国内可达但需走代理的域名
  - DOMAIN-SUFFIX,xn--ngstr-lra8j.com,🚀 节点选择
  - DOMAIN-SUFFIX,services.googleapis.cn,🚀 节点选择
  - RULE-SET,googlecnproxyip,🚀 节点选择
  # 直连
  - RULE-SET,lan,DIRECT,no-resolve
  - RULE-SET,unban,DIRECT
  - RULE-SET,chinadomain,DIRECT
  - RULE-SET,chinamedia,DIRECT
  - RULE-SET,chinacompanyip,DIRECT,no-resolve
  - RULE-SET,chinaip,DIRECT,no-resolve
  - RULE-SET,direct,DIRECT
  - GEOIP,CN,DIRECT,no-resolve
  # 兜底
  - MATCH,🚀 节点选择
