[custom]
;==================== 规则集 ====================
;广告拦截(只保留一份)
ruleset=REJECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=REJECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list

;Steam 国内下载直连(必须在 Steam 代理规则之前)
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/SteamCN.list

;分流服务
ruleset=📹 YouTube,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/YouTube.list
ruleset=🤖 AI,https://raw.githubusercontent.com/joe010203/125/refs/heads/main/AI.list
ruleset=🎮 游戏平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Epic.list
ruleset=🎮 游戏平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Origin.list
ruleset=🎮 游戏平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Sony.list
ruleset=🎮 游戏平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Steam.list
ruleset=🎮 游戏平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Nintendo.list

;Google 国内可达但需走代理的域名
ruleset=🚀 节点选择,[]DOMAIN-SUFFIX,xn--ngstr-lra8j.com
ruleset=🚀 节点选择,[]DOMAIN-SUFFIX,services.googleapis.cn
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/GoogleCNProxyIP.list

;直连
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaMedia.list
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaIp.list
ruleset=DIRECT,https://raw.githubusercontent.com/joe010203/125/refs/heads/main/Direct.list
ruleset=DIRECT,[]GEOIP,CN,no-resolve

;兜底
ruleset=🚀 节点选择,[]FINAL

;==================== 策略组 ====================
;--- 服务组 ---
custom_proxy_group=📹 YouTube`select`[]DIRECT`[]🚀 节点选择`[]♻️ 自动选择`[]⚖️ 香港均衡`[]⚖️ 台湾均衡`[]🔮 魔戒`[]👻 Glados1`[]👻 Glados2`[]👻 Glados3`[]🐮 牛逼`[]🌸 永雏塔菲`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇲 美国节点`[]🇹🇼 台湾节点`[]🏠 住宅选择`.*
custom_proxy_group=🤖 AI`select`[]🚀 节点选择`[]🏠 住宅选择`[]🇺🇲 美国节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇹🇼 台湾节点`[]🇭🇰 香港节点`[]🔮 魔戒`[]👻 Glados1`[]👻 Glados2`[]👻 Glados3`[]🐮 牛逼`[]🌸 永雏塔菲`[]♻️ 自动选择`[]DIRECT`.*
custom_proxy_group=🎮 游戏平台`select`[]DIRECT`[]🚀 节点选择`[]♻️ 自动选择`[]🔮 魔戒`[]👻 Glados1`[]👻 Glados2`[]👻 Glados3`[]🐮 牛逼`[]🌸 永雏塔菲`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇲 美国节点`[]🇹🇼 台湾节点`[]🏠 住宅选择`.*
custom_proxy_group=🚀 节点选择`select`[]⚖️ 香港均衡`[]⚖️ 台湾均衡`[]🔮 魔戒`[]👻 Glados1`[]👻 Glados2`[]👻 Glados3`[]🐮 牛逼`[]🌸 永雏塔菲`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇲 美国节点`[]🇹🇼 台湾节点`[]🏠 住宅选择`.*

;--- 机场分组 ---
custom_proxy_group=🔮 魔戒`select`^魔戒 ((?!(到期|流量|套餐|官网|过滤)).)*$
custom_proxy_group=👻 Glados1`select`^Glados1 ((?!(到期|流量|套餐|官网)).)*$
custom_proxy_group=👻 Glados2`select`^Glados2 ((?!(到期|流量|套餐|官网)).)*$
custom_proxy_group=👻 Glados3`select`^Glados3 ((?!(到期|流量|套餐|官网)).)*$
custom_proxy_group=🐮 牛逼`select`^牛逼 ((?!(到期|流量|套餐|官网|如果只显示|是客户端太旧|更新一下客户端|请到网站使用教程|请尽快下载|请看网站公告)).)*$
custom_proxy_group=🌸 永雏塔菲`select`^永雏塔菲 ((?!(到期|流量|套餐|官网|状态|账户欠费)).)*$

;--- 自动测速 / 均衡 ---
custom_proxy_group=♻️ 自动选择`url-test`^((?!(到期|流量|套餐|官网|剩余|过滤|如果只显示|是客户端太旧|更新一下客户端|请到网站使用教程|请尽快下载|请看网站公告|状态|账户欠费|2.0|2倍|2x|3.0|3倍|3x|4.0|4倍|4x)).)*$`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=⚖️ 香港均衡`load-balance`(?=.*(香港|HK|Hong Kong|🇭🇰|HongKong))^((?!(深港|US|家宽|游戏|剩余|流量|2.0|2倍|2x|3.0|3倍|3x|4.0|4倍|4x)).)*$`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=⚖️ 台湾均衡`load-balance`(?=.*(台湾|台北|TW|Taiwan|中华电信|HiNet))^((?!(家宽|游戏|剩余|流量|2.0|2倍|2x|3.0|3倍|3x|4.0|4倍|4x)).)*$`https://www.gstatic.com/generate_204`300,,50

;--- 地区分组 ---
custom_proxy_group=🇭🇰 香港节点`url-test`(?=.*(香港|HK|Hong Kong|🇭🇰|HongKong))^((?!(深港|US|游戏|剩余|流量|2.0|2倍|2x|3.0|3倍|3x|4.0|4倍|4x)).)*$`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇯🇵 日本节点`url-test`(?=.*(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan))^((?!(游戏|剩余|流量|2.0|2倍|2x|3.0|3倍|3x|4.0|4倍|4x)).)*$`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇸🇬 新加坡节点`url-test`(?=.*(新加坡|坡|狮城|SG|Singapore))^((?!(游戏|剩余|流量|2.0|2倍|2x|3.0|3倍|3x|4.0|4倍|4x)).)*$`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇺🇲 美国节点`url-test`(?=.*(美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States))^((?!(游戏|剩余|流量|2.0|2倍|2x|3.0|3倍|3x|4.0|4倍|4x)).)*$`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇹🇼 台湾节点`url-test`(?=.*(台湾|台北|TW|Taiwan|中华电信|HiNet))^((?!(游戏|剩余|流量|2.0|2倍|2x|3.0|3倍|3x|4.0|4倍|4x)).)*$`https://www.gstatic.com/generate_204`300,,50

;--- 其他 ---
custom_proxy_group=🔗 链式前置`select`[]🔮 魔戒`[]👻 Glados1`[]👻 Glados2`[]🐮 牛逼`[]🌸 永雏塔菲`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇲 美国节点`[]🇹🇼 台湾节点`[]♻️ 自动选择`.*
custom_proxy_group=🏠 住宅选择`select`[]DIRECT`(?=.*(住宅))^((?!(选择)).)*$

enable_rule_generator=true
overwrite_original_rules=true



